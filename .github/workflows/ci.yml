name: CI

# Builds and tests every push to main and every pull request
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The supported range: the oldest and the newest tested Keycloak (see Compatibility in the README)
    strategy:
      fail-fast: false
      matrix:
        keycloak: ['26.0.8', '26.8.2']
        openfga: ['v1.23.0']
    name: test (Keycloak ${{ matrix.keycloak }}, OpenFGA ${{ matrix.openfga }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Unit tests, then integration tests with Keycloak and OpenFGA in Docker (Testcontainers)
      - name: Unit and integration tests
        run: >-
          mvn -B verify
          -Dkeycloak.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}
          -Dopenfga.image=openfga/openfga:${{ matrix.openfga }}

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-keycloak-${{ matrix.keycloak }}
          path: |
            target/surefire-reports
            target/failsafe-reports
