name: Release

# Push a tag to release: vX.Y.Z is a release, vX.Y.Z-rc.N or vX.Y.Z-beta.N a pre-release.
# The tag sets the version of the jar.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Unit tests, then integration tests with Keycloak and OpenFGA in Docker (Testcontainers)
      - name: Unit and integration tests
        run: mvn -B verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Maven
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B clean package -DskipTests

      - name: Prepare release assets
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir dist
          cp target/keycloak-openfga-event-publisher.jar "dist/keycloak-openfga-event-publisher-$VERSION.jar"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create changelog text
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude_types: other,doc,chore
          include_commit_body: true
          config_file: .github/tag-changelog-config.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.number }}
          body: ${{ steps.changelog.outputs.changes }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
