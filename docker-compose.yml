# volumes:
#  postgres_data:
#    driver: local

services:
  postgres:
    image: postgres:14
    container_name: postgres
 #   volumes:
 #     - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5  
    ports:
      - 5433:5432
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:9080
      KC_SPI_EVENTS_LISTENER_OPENFGA_EVENTS_PUBLISHER_OPENFGA_API_URL: http://openfga:8080
      KC_LOG_LEVEL: INFO,com.twogenidentity.keycloak:debug
    ports:
      - 9080:8080
      - 8443:8443
    volumes:
      - $PWD/target/keycloak-openfga-event-publisher.jar:/opt/keycloak/providers/keycloak-openfga-event-publisher.jar
    depends_on:
      postgres:
        condition: service_healthy
      openfga-import:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          -  keycloak

  postgres-openfga:
    image: postgres:14
    container_name: postgres-openfga
    command: postgres -c 'max_connections=100'
    networks:
      - default
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    depends_on:
      postgres-openfga:
        condition: service_healthy
    image: openfga/openfga:v1.23.0
    container_name: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres-openfga:5432/postgres?sslmode=disable
    command: migrate
    networks:
      - default
  
  openfga:
    depends_on:
      migrate:
        condition: service_completed_successfully
    image: openfga/openfga:v1.23.0
    container_name: openfga
    command: run
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:password@postgres-openfga:5432/postgres?sslmode=disable
      - OPENFGA_DATASTORE_MAX_OPEN_CONNS=100
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=openfga:8081"]
      interval: 3s
      timeout: 30s
      retries: 3
    networks:
      - default
    ports:
      - "8080:8080" #http
      - "8081:8081" #grpc
      - "3000:3000" #playground

  # Creates the "keycloak" store with model.dsl (openfga-store.yaml), so the extension has a store and model to publish to
  openfga-import:
    depends_on:
      openfga:
        condition: service_healthy
    image: openfga/cli:v0.9.0
    container_name: openfga-import
    restart: "no"
    command: "store import --api-url http://openfga:8080 --file /tmp/openfga/openfga-store.yaml"
    volumes:
      - $PWD/openfga-store.yaml:/tmp/openfga/openfga-store.yaml:ro
      - $PWD/model.dsl:/tmp/openfga/model.dsl:ro
    networks:
      - default
